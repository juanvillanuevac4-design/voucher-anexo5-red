services:
  - type: web
    name: voucher-anexo5-red
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 4 --timeout 120 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USUARIO
        value: admin
      - key: ADMIN_CLAVE
        sync: false
      - key: ZONA_HORARIA
        value: America/Santiago
      - key: PYTHON_VERSION
        value: 3.12.7
